<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BillBook — Invoices, done in minutes</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root{
  --ink:#16233F;
  --ink-2:#22335A;
  --paper:#FFFFFF;
  --canvas:#F3F4F7;
  --line:#E4E7EC;
  --line-soft:#EEF0F3;
  --text:#1B2130;
  --muted:#6B7280;
  --muted-2:#98A2B3;
  --danger:#B3261E;
  --danger-bg:#FBEAE9;
  --amber:#B4740E;
  --amber-bg:#FCF3E3;
  --brand:#1B6F5C;
  --brand-ink:#0F4C3F;
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:18px;
  --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --shadow-pop:0 8px 24px rgba(16,24,40,.14), 0 2px 6px rgba(16,24,40,.08);
  --shadow-paper:0 1px 1px rgba(16,24,40,.03), 0 12px 32px rgba(16,24,40,.10), 0 2px 8px rgba(16,24,40,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--text);
  background:var(--canvas);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.5;
}
#root{min-height:100vh;}
h1,h2,h3,h4{margin:0;font-family:'Inter',sans-serif;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);}
a{color:inherit;text-decoration:none;}
::selection{background:color-mix(in srgb, var(--brand) 25%, white);}
.num{font-family:'Space Grotesk',monospace;font-variant-numeric:tabular-nums;}

/* scrollbar */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D0D5DD;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--brand); outline-offset:2px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
/* ============================= GENERIC HELPERS ============================= */
.muted{ color:var(--muted); }
.small{ font-size:12.5px; }
.stack-lg > * + *{ margin-top:18px; }

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 15px; border-radius:var(--radius-s); border:1px solid transparent;
  font-weight:600; font-size:13.5px; background:var(--paper); color:var(--text);
  transition:background .16s ease, border-color .16s ease, transform .1s ease, box-shadow .16s ease;
  white-space:nowrap;
}
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--brand); color:#fff; box-shadow:var(--shadow-card); }
.btn-primary:hover{ filter:brightness(1.06); }
.btn-ghost{ background:transparent; border-color:var(--line); color:var(--text); }
.btn-ghost:hover{ background:var(--canvas); }
.btn-danger{ background:var(--danger); color:#fff; }
.btn-danger:hover{ filter:brightness(1.08); }
.btn-lg{ padding:11px 20px; font-size:14.5px; }
.btn-sm{ padding:6px 11px; font-size:12.5px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.icon-btn{
  display:inline-flex; align-items:center; justify-content:center;
  width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
  background:var(--paper); color:var(--muted); transition:background .15s, color .15s, border-color .15s;
}
.icon-btn:hover{ background:var(--canvas); color:var(--text); }
.icon-btn-danger:hover{ background:var(--danger-bg); color:var(--danger); border-color:#F1C6C3; }

.link-btn{
  display:inline-flex; align-items:center; gap:4px; background:none; border:none; color:var(--brand);
  font-weight:600; font-size:13px; padding:4px 0;
}

/* ============================= APP SHELL ============================= */
.app-shell{ display:flex; min-height:100vh; }
.app-main{ flex:1; min-width:0; }
.app-main-inner{ max-width:1180px; margin:0 auto; padding:28px 32px 90px; }

.boot-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ink); }
.boot-mark{ width:56px; height:56px; border-radius:16px; background:rgba(255,255,255,.08); color:#fff; display:flex; align-items:center; justify-content:center; }

/* ============================= SIDEBAR ============================= */
.sidebar{
  width:248px; flex-shrink:0; background:var(--ink); color:#EDF0F5;
  display:flex; flex-direction:column; padding:20px 16px; gap:18px;
  position:sticky; top:0; height:100vh;
}
.sidebar-brand{ display:flex; align-items:center; gap:10px; cursor:pointer; padding:4px 4px; }
.brand-mark{ width:34px; height:34px; border-radius:10px; background:linear-gradient(155deg, var(--brand), var(--brand-ink)); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
.brand-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15.5px; color:#fff; letter-spacing:.2px; }
.brand-sub{ font-size:11px; color:#8B96AE; margin-top:1px; }

.sidebar-cta{
  display:flex; align-items:center; justify-content:center; gap:7px;
  background:var(--brand); color:#fff; border:none; border-radius:var(--radius-s);
  padding:11px; font-weight:600; font-size:13.5px; transition:filter .15s;
}
.sidebar-cta:hover{ filter:brightness(1.08); }

.sidebar-nav{ display:flex; flex-direction:column; gap:2px; flex:1; }
.sidebar-link{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px;
  background:none; border:none; color:#B8C0D4; font-size:13.5px; font-weight:500; text-align:left;
  transition:background .15s, color .15s;
}
.sidebar-link:hover{ background:rgba(255,255,255,.06); color:#fff; }
.sidebar-link-active{ background:rgba(255,255,255,.1); color:#fff; }

.sidebar-profile{
  display:flex; align-items:center; gap:10px; padding:9px; border-radius:10px; border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03); text-align:left;
}
.sidebar-profile:hover{ background:rgba(255,255,255,.06); }
.avatar{
  width:32px; height:32px; border-radius:9px; background:var(--brand); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.sidebar-profile-text{ min-width:0; }
.sidebar-profile-name{ font-size:13px; font-weight:600; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sidebar-profile-sub{ font-size:11.5px; color:#8B96AE; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ============================= MOBILE NAV ============================= */
.mobile-nav{ display:none; }

/* ============================= TOPBAR ============================= */
.topbar{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
.topbar-title{ font-size:22px; font-weight:700; letter-spacing:-.2px; }
.topbar-sub{ margin-top:4px; font-size:13.5px; }
.topbar-right{ flex-shrink:0; }

/* ============================= ONBOARDING ============================= */
.onboarding-shell{ min-height:100vh; background:var(--canvas); }
.onboarding-header{ display:flex; align-items:center; gap:10px; padding:22px 28px; background:var(--ink); color:#fff; }
.onboarding-header .brand-sub{ color:#AEB8CC; }
.onboarding-body{ max-width:760px; margin:0 auto; padding:32px 20px 80px; }

/* ============================= PANELS / FORM ============================= */
.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-m); padding:22px; margin-bottom:18px; box-shadow:var(--shadow-card); }
.panel-danger{ border-color:#F1C6C3; background:#FEFBFA; }
.panel-title{ font-size:15px; font-weight:700; margin-bottom:4px; }
.panel-head-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px 18px; margin-top:14px; }
.grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 18px; margin-top:14px; }

.field{ display:flex; flex-direction:column; gap:6px; }
.field-label{ font-size:12.5px; font-weight:600; color:#3A4257; }
.field-label em{ color:var(--danger); font-style:normal; margin-left:3px; }
.field-hint{ font-size:11.5px; color:var(--muted-2); }

.input{
  width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
  background:var(--paper); transition:border-color .15s, box-shadow .15s;
}
.input:focus{ border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 16%, transparent); outline:none; }
textarea.input{ resize:vertical; min-height:40px; }

.form-footer{ display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:12px; }
.hr-thin{ height:1px; background:var(--line-soft); border:none; }

/* upload */
.upload-field{ display:flex; flex-direction:column; gap:6px; }
.upload-box{ display:flex; }
.upload-dropzone{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  width:100%; padding:20px; border:1.5px dashed var(--line); border-radius:10px; background:var(--canvas); color:var(--muted);
  font-size:12.5px; font-weight:600; transition:border-color .15s, color .15s;
}
.upload-dropzone:hover{ border-color:var(--brand); color:var(--brand); }
.upload-preview{ display:flex; align-items:center; gap:12px; padding:10px; border:1px solid var(--line); border-radius:10px; width:100%; }
.upload-preview img{ width:52px; height:52px; object-fit:contain; border-radius:6px; background:var(--canvas); }

/* color swatches */
.swatch-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; }
.swatch{ width:28px; height:28px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px var(--line); cursor:pointer; padding:0; }
.swatch-active{ box-shadow:0 0 0 2px var(--paper), 0 0 0 4px var(--ink); }
.swatch-custom{ position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.swatch-custom input{ position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }

/* template picker */
.template-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:8px; }
.template-pick{ border:1.5px solid var(--line); border-radius:12px; padding:10px; background:var(--paper); text-align:left; transition:border-color .15s; }
.template-pick-active{ border-color:var(--pick-color, var(--brand)); box-shadow:0 0 0 3px color-mix(in srgb, var(--pick-color, var(--brand)) 14%, transparent); }
.template-thumb{ height:56px; border-radius:8px; border:1px solid var(--line-soft); margin-bottom:8px; padding:8px; display:flex; align-items:flex-start; }
.template-thumb span{ display:block; width:60%; height:8px; border-radius:2px; }
.thumb-minimal span{ width:40%; }
.template-pick-name{ font-size:12.5px; font-weight:700; }
.template-pick-desc{ font-size:11px; margin-top:1px; }
.template-row-compact{ display:flex; gap:8px; }
.template-chip{ padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--paper); font-size:12.5px; font-weight:600; color:var(--muted); }
.template-chip-active{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* switch */
.switch{ position:relative; display:inline-block; }
.switch input{ position:absolute; opacity:0; width:0; height:0; }
.switch-track{ display:block; width:38px; height:22px; border-radius:20px; background:#D0D5DD; transition:background .18s; position:relative; }
.switch-thumb{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .18s; }
.switch input:checked + .switch-track{ background:var(--brand); }
.switch input:checked + .switch-track .switch-thumb{ transform:translateX(16px); }

/* ============================= STAT CARDS ============================= */
.stat-grid{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:22px; }
.stat-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-m); padding:16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-card); }
.stat-icon{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-value{ font-size:19px; font-weight:700; letter-spacing:-.2px; }
.stat-label{ font-size:12px; margin-top:1px; }

/* ============================= TABLES ============================= */
.table-wrap{ overflow-x:auto; }
.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
.data-table th{ text-align:left; padding:10px 12px; font-size:11.5px; text-transform:none; color:var(--muted); font-weight:600; border-bottom:1px solid var(--line); white-space:nowrap; }
.data-table td{ padding:12px; border-bottom:1px solid var(--line-soft); vertical-align:middle; white-space:nowrap; }
.data-table tr:last-child td{ border-bottom:none; }
.row-clickable{ cursor:pointer; transition:background .12s; }
.row-clickable:hover{ background:var(--canvas); }
.row-actions{ display:flex; gap:4px; justify-content:flex-end; }

/* ============================= EMPTY STATE ============================= */
.empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:52px 20px; }
.empty-icon{ width:52px; height:52px; border-radius:14px; background:var(--canvas); color:var(--muted-2); display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
.empty-state h3{ font-size:15px; font-weight:700; }
.empty-state p{ margin-top:4px; font-size:13px; max-width:320px; }

/* ============================= STAMPS / STATUS ============================= */
.stamp{
  display:inline-flex; align-items:center; padding:4px 11px; border-radius:20px; font-size:11.5px;
  font-weight:700; letter-spacing:.3px; border:1.5px solid transparent;
}
.stamp-paid{ background:#E7F5EE; color:#177245; border-color:#B8E4CC; }
.stamp-unpaid{ background:var(--danger-bg); color:#A32A22; border-color:#F1C6C3; }
.stamp-partial{ background:var(--amber-bg); color:#95610C; border-color:#F0D8A6; }

/* ============================= TOAST ============================= */
.toast-stack{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:400; align-items:center; }
.toast{
  display:flex; align-items:center; gap:8px; background:var(--ink); color:#fff; padding:11px 16px; border-radius:10px;
  font-size:13px; font-weight:500; box-shadow:var(--shadow-pop); animation:toast-in .2s ease;
}
.toast-error{ background:#7A2119; }
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }

/* ============================= MODAL ============================= */
.modal-overlay{ position:fixed; inset:0; background:rgba(16,20,30,.5); display:flex; align-items:center; justify-content:center; z-index:500; padding:16px; animation:fade-in .15s ease; }
@keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }
.modal-card{ background:var(--paper); border-radius:var(--radius-l); padding:24px; width:100%; box-shadow:var(--shadow-pop); animation:pop-in .18s ease; }
@keyframes pop-in{ from{ opacity:0; transform:translateY(8px) scale(.98); } to{ opacity:1; transform:translateY(0) scale(1); } }
.modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.modal-head h3{ font-size:15.5px; font-weight:700; }
.confirm-icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:var(--danger-bg); color:var(--danger); }
.confirm-icon[data-danger="false"]{ background:#E7F0FF; color:#2C4FBF; }
.modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }

/* ============================= FILTER BAR ============================= */
.filter-bar{ display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.search-box{ flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:8px 12px; color:var(--muted-2); }
.search-box input{ border:none; outline:none; flex:1; font-size:13.5px; background:transparent; color:var(--text); }

/* ============================= INVOICE BUILDER ============================= */
.invoice-builder{ display:grid; grid-template-columns:1fr 420px; gap:24px; align-items:start; }
.builder-preview{ position:relative; }
.builder-preview-sticky{ position:sticky; top:20px; }
.preview-label{ margin-bottom:8px; font-weight:600; letter-spacing:.3px; }
.preview-scale-wrap{ transform:scale(.62); transform-origin:top left; width:210mm; margin-bottom:calc(-297mm * .38); }
.builder-preview .preview-scale-wrap{ width:210mm; }
.preview-center{ display:flex; justify-content:center; overflow:hidden; }
.preview-center .preview-scale-wrap{ transform:scale(.82); transform-origin:top center; margin-bottom:calc(-297mm * .18); }

/* stepper */
.stepper{ display:flex; align-items:center; margin-bottom:18px; }
.step-pill{ display:flex; align-items:center; gap:8px; background:none; border:none; padding:6px 4px; font-weight:600; font-size:13.5px; color:var(--muted-2); }
.step-pill:disabled{ cursor:not-allowed; }
.step-pill-active{ color:var(--text); }
.step-num{ width:22px; height:22px; border-radius:50%; background:var(--line); color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:700; }
.step-pill-active .step-num{ background:var(--brand); color:#fff; }
.step-line{ flex:1; height:1px; background:var(--line); margin:0 12px; max-width:80px; }

/* item rows */
.item-row{ display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line-soft); }
.item-row-header{ border-bottom:none; padding-bottom:4px; font-weight:600; }
.item-row-grid{ flex:1; display:grid; grid-template-columns:2fr 1.2fr .6fr 1fr 1fr; gap:8px; align-items:center; }
.item-amount{ font-weight:600; text-align:right; padding-right:4px; }
.item-row-actions{ display:flex; gap:4px; flex-shrink:0; }

.discount-row{ display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:16px; align-items:start; }
.mini-totals{ background:var(--canvas); border-radius:10px; padding:12px 14px; }
.mini-totals > div{ display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
.mini-total-final{ font-weight:700; font-size:14.5px; border-top:1px solid var(--line); margin-top:5px; padding-top:8px !important; }

/* mobile preview trigger (hidden on desktop) */
.mobile-preview-btn{ display:none; }
.mobile-preview-overlay{ display:none; }

/* ============================= INVOICE PAPER ============================= */
.invoice-paper{
  width:210mm; min-height:297mm; background:#fff; position:relative; overflow:hidden;
  box-shadow:var(--shadow-paper); border-radius:2px;
  display:flex; flex-direction:column;
}
.watermark{
  position:absolute; top:50%; left:50%; width:56%; transform:translate(-50%,-50%); opacity:.09; pointer-events:none; z-index:0;
  object-fit:contain;
}
.inv-inner{ position:relative; z-index:1; padding:18mm 16mm 8mm; font-size:11.5px; color:#1B2130; flex:1 1 auto; }
.inv-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.inv-head-left{ display:flex; align-items:center; gap:12px; }
.inv-logo{ width:52px; height:52px; object-fit:contain; border-radius:8px; }
.inv-logo-light{ background:rgba(255,255,255,.15); padding:4px; }
.inv-biz-name{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; }
.inv-title{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; letter-spacing:1.5px; color:var(--ink); }
.inv-meta{ display:flex; justify-content:space-between; gap:24px; margin-bottom:18px; }
.meta-col{ display:flex; flex-direction:column; gap:4px; }
.meta-row{ display:flex; gap:16px; justify-content:space-between; font-size:11.5px; min-width:150px; }
.bt-block{ text-align:right; max-width:220px; }
.bt-label{ font-size:10.5px; font-weight:700; color:var(--muted); margin-bottom:3px; letter-spacing:.3px; }
.bt-name{ font-weight:700; font-size:13px; }
.bt-line{ font-size:11px; margin-top:2px; }

/* classic header/meta, matched to the reference layout */
.inv-head-classic{ display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:56px; }
.inv-logo-classic{ max-width:200px; max-height:56px; object-fit:contain; object-position:left center; display:block; }
.inv-meta-classic{ display:flex; justify-content:space-between; align-items:flex-start; margin:30px 0 22px; gap:20px; }
.meta-rows{ display:flex; flex-direction:column; gap:7px; }
.meta-line{ display:flex; gap:10px; font-size:11.5px; }
.meta-label{ color:var(--muted); min-width:78px; }
.meta-value{ color:#1B2130; }
.meta-strong{ font-weight:700; }

const { useState, useEffect, useRef, useMemo, useCallback, createContext, useContext } = React;

function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function loadLS(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ return fallback; }
}
function saveLS(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ /* storage full or blocked */ }
}

function money(n){
  const v = Number(n)||0;
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('en-US', { day:'2-digit', month:'short', year:'numeric' });
}

function todayISO(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

function monthKey(iso){ return (iso||'').slice(0,7); }

function computeTotals(items, discountType, discountValue){
  const subtotal = (items||[]).reduce((s,it)=> s + (Number(it.qty)||0)*(Number(it.price)||0), 0);
  let discount = 0;
  if(discountType === 'percent'){ discount = subtotal * ((Number(discountValue)||0)/100); }
  else { discount = Number(discountValue)||0; }
  discount = Math.min(discount, subtotal);
  if(discount < 0) discount = 0;
  const total = Math.max(subtotal - discount, 0);
  return { subtotal, discount, total };
}

function nextInvoiceNumber(business){
  const seq = business.nextInvoiceSeq || 1;
  const padded = String(seq).padStart(6,'0');
  return (business.invoicePrefix || 'INV') + '-' + padded;
}

const BRAND_PRESETS = [
  { name:'Ledger Green', value:'#1B6F5C' },

    currencySymbol:'৳', currencyStyle:'suffix', setupSkipped:false
  };
}

/* Formats an amount the way the business has configured currency display.
   "suffix" -> 850/-   (common BDT convention, no symbol needed)
   "prefix" -> ৳850.00 (symbol + amount, decimals shown) */
function formatMoney(amount, business){
  const symbol = (business && business.currencySymbol) || '৳';
  const style = (business && business.currencyStyle) || 'suffix';
  const v = Number(amount) || 0;
  if(style === 'prefix'){
    return symbol + money(v);
  }
  const isWhole = Math.round(v * 100) % 100 === 0;
  const numStr = isWhole ? Math.round(v).toLocaleString('en-US') : money(v);
  return numStr + '/-';
}

/* ============================= TOAST ============================= */
const ToastCtx = createContext(null);
function ToastProvider({ children }){
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, kind='default')=>{
    const id = uid('toast');
    setToasts(t => [...t, { id, message, kind }]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 3200);
  },[]);
  return (
    <ToastCtx.Provider value={push}>
      {children}
      <div className="toast-stack">
        {toasts.map(t => (
          <div key={t.id} className={"toast toast-"+t.kind}>
            <Icon name={t.kind==='error' ? 'alert' : 'check'} size={16}/>
            <span>{t.message}</span>
          </div>
        ))}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast(){ return useContext(ToastCtx); }

/* ============================= MODAL / CONFIRM ============================= */
function Modal({ open, onClose, title, children, width=520 }){
  if(!open) return null;
  return (
    <div className="modal-overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-card" style={{ maxWidth:width }}>
        <div className="modal-head">
          <h3>{title}</h3>
          <button className="icon-btn" onClick={onClose}><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function ConfirmDialog({ open, title, message, confirmLabel='Delete', danger=true, onConfirm, onCancel }){
  if(!open) return null;
  return (
    <div className="modal-overlay" onMouseDown={(e)=>{ if(e.target===e.currentTarget) onCancel(); }}>
      <div className="modal-card" style={{ maxWidth:420 }}>
        <div className="confirm-icon" data-danger={danger}><Icon name="alert" size={20}/></div>
        <h3 style={{ marginTop:14 }}>{title}</h3>
        <p className="muted" style={{ marginTop:6 }}>{message}</p>
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onCancel}>Cancel</button>
          <button className={danger ? "btn btn-danger" : "btn btn-primary"} onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

function StatusBadge({ status }){

    unpaid:  { label:'Unpaid',  cls:'stamp-unpaid' },
    partial: { label:'Partial', cls:'stamp-partial' },
  };
  const s = map[status] || map.unpaid;
  return <span className={"stamp "+s.cls}>{s.label}</span>;
}

function Field({ label, hint, children, required }){

      <span className="field-label">{label}{required && <em>*</em>}</span>
      {children}
      {hint && <span className="field-hint">{hint}</span>}

  );
}
function TextInput(props){ return <input className="input" {...props} />; }
function TextArea(props){ return <textarea className="input" rows={2} {...props} />; }
function Select({ children, ...props }){ return <select className="input" {...props}>{children}</select>; }

/* ============================= QR CODE ============================= */
function QRBlock({ content, size=84 }){
  const ref = useRef(null);
  const qrRef = useRef(null);
  useEffect(()=>{
    if(!ref.current || !content) return;
    ref.current.innerHTML = '';
    try{
      qrRef.current = new QRCode(ref.current, { text: content, width:size, height:size, correctLevel: QRCode.CorrectLevel.M });
    }catch(e){ /* qrcodejs not ready */ }
  }, [content, size]);
  if(!content) return null;
  return <div className="qr-box" ref={ref}></div>;
}

function qrContentFor(invoice, business){
  const q = invoice.qr || {};
  if(!q.enabled) return '';
  if(q.type === 'bkash') return business.bkashNumber || '';
  if(q.type === 'nagad') return business.nagadNumber || '';
  if(q.type === 'rocket') return business.rocketNumber || '';
  if(q.type === 'website') return business.website || '';
  if(q.type === 'whatsapp') return business.whatsapp || '';
  if(q.type === 'custom') return q.content || '';
  return '';
}

/* ============================= IMAGE UPLOAD HELPER ============================= */
function ImageUpload({ label, value, onChange, hint }){
  const inputRef = useRef(null);
  const onFile = (e) => {
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => onChange(reader.result);
    reader.readAsDataURL(file);
  };
  return (
    <div className="upload-field">
      <span className="field-label">{label}</span>
      <div className="upload-box">
        {value ? (
          <div className="upload-preview">
            <img src={value} alt="" />
            <button type="button" className="btn btn-ghost btn-sm" onClick={()=>onChange('')}>Remove</button>
          </div>
        ) : (
          <button type="button" className="upload-dropzone" onClick={()=>inputRef.current.click()}>
            <Icon name="upload" size={18}/>
            <span>Upload image</span>
          </button>
        )}
        <input ref={inputRef} type="file" accept="image/*" style={{ display:'none' }} onChange={onFile} />
      </div>
      {hint && <span className="field-hint">{hint}</span>}
    </div>
  );
}

        <StatCard label="Total Sales" value={formatMoney(stats.totalSales, business)} icon="stamp" tint="#1B6F5C" />

          <h3 className="panel-title" style={{ marginBottom:0 }}>Recent invoices</h3>
          <button className="link-btn" onClick={()=>go('invoices')}>View all <Icon name="chevronRight" size={14}/></button>

  const isEdit = !!existingInvoice;
  const [step, setStep] = useState(1);
  const [showMobilePreview, setShowMobilePreview] = useState(false);

  const [customer, setCustomer] = useState(existingInvoice ? existingInvoice.customer : { name:'', phone:'', email:'', address:'' });
  const [items, setItems] = useState(existingInvoice ? existingInvoice.items : [blankItem()]);
  const [discountType, setDiscountType] = useState(existingInvoice ? existingInvoice.discountType : 'fixed');
  const [discountValue, setDiscountValue] = useState(existingInvoice ? existingInvoice.discountValue : 0);
  const [number, setNumber] = useState(existingInvoice ? existingInvoice.number : nextInvoiceNumber(business));
  const [date, setDate] = useState(existingInvoice ? existingInvoice.date : todayISO());
  const [template, setTemplate] = useState(existingInvoice ? (existingInvoice.template || business.template) : business.template);
  const [status, setStatus] = useState(existingInvoice ? existingInvoice.status : 'unpaid');
  const [qrEnabled, setQrEnabled] = useState(existingInvoice ? existingInvoice.qr.enabled : false);
  const [qrType, setQrType] = useState(existingInvoice ? (existingInvoice.qr.type||'bkash') : 'bkash');
  const [qrCustom, setQrCustom] = useState(existingInvoice ? (existingInvoice.qr.content||'') : '');

  const totals = useMemo(()=> computeTotals(items, discountType, discountValue), [items, discountType, discountValue]);

  const previewInvoice = {
    number, date, template, customer, items, discountType, discountValue,
    ...totals, status, qr: { enabled: qrEnabled, type: qrType, content: qrCustom }
  };

  const setItem = (idx, next) => setItems(prev => prev.map((it,i)=> i===idx ? next : it));
  const deleteItem = (idx) => setItems(prev => prev.length>1 ? prev.filter((_,i)=>i!==idx) : prev);
  const duplicateItem = (idx) => setItems(prev => {
    const copy = { ...prev[idx], id: uid('it') };
    const next = [...prev]; next.splice(idx+1, 0, copy); return next;

  const addItem = () => setItems(prev => [...prev, blankItem()]);

  const canGoStep2 = customer.name.trim().length > 0;

  const handleSave = () => {
    if(!customer.name.trim()){ setStep(1); return; }
    const cleanItems = items.filter(it => it.description.trim() || Number(it.price) > 0);
    onSave({
      id: existingInvoice ? existingInvoice.id : uid('inv'),
      number, date, template, customer,
      items: cleanItems.length ? cleanItems : items,
      discountType, discountValue, status,
      qr: { enabled: qrEnabled, type: qrType, content: qrCustom },

function InvoiceHistory({ invoices, business, go, onDuplicate, onDelete, onDownload }){
  const [q, setQ] = useState('');
  const [status, setStatus] = useState('all');
  const [dateFilter, setDateFilter] = useState('all');
  const [confirmDelete, setConfirmDelete] = useState(null);

  const filtered = useMemo(()=>{
    const now = new Date();
    return invoices.filter(inv => {
      if(status !== 'all' && inv.status !== status) return false;
      if(q){
        const hay = (inv.number+' '+inv.customer.name+' '+(inv.customer.phone||'')).toLowerCase();
        if(!hay.includes(q.toLowerCase())) return false;
      }
      if(dateFilter !== 'all'){
        const d = new Date(inv.date+'T00:00:00');
        if(dateFilter==='month' && monthKey(inv.date) !== now.toISOString().slice(0,7)) return false;
        if(dateFilter==='7d' && (now - d) > 7*86400000) return false;
        if(dateFilter==='30d' && (now - d) > 30*86400000) return false;
      }
      return true;
    }).sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  }, [invoices, q, status, dateFilter]);

  return (
    <div>
      <Topbar title="Invoices" subtitle={`${invoices.length} total`} right={<button className="btn btn-primary" onClick={()=>go('invoice-new')}><Icon name="plus" size={16}/>Create Invoice</button>} />

      <div className="filter-bar">
        <div className="search-box">
          <Icon name="search" size={16} />
          <input placeholder="Search by invoice # or customer" value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <Select value={status} onChange={e=>setStatus(e.target.value)} style={{ maxWidth:160 }}>
          <option value="all">All statuses</option>
          <option value="paid">Paid</option>
          <option value="unpaid">Unpaid</option>
          <option value="partial">Partial</option>
        </Select>
        <Select value={dateFilter} onChange={e=>setDateFilter(e.target.value)} style={{ maxWidth:160 }}>
          <option value="all">All time</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
          <option value="month">This month</option>
        </Select>
      </div>

      <div className="panel">
        {filtered.length === 0 ? (
          <EmptyState icon="file" title={invoices.length===0 ? "No invoices yet" : "No invoices match your filters"} subtitle={invoices.length===0 ? "Create your first invoice in seconds." : "Try a different search or filter."} actionLabel={invoices.length===0 ? "Create Invoice" : null} onAction={()=>go('invoice-new')} />
        ) : (
          <div className="table-wrap">
            <table className="data-table">
              <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th style={{textAlign:'right'}}>Total</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {filtered.map(inv => (
                  <tr key={inv.id} className="row-clickable" onClick={()=>go('invoice-view', inv.id)}>
                    <td className="num">{inv.number}</td>
                    <td>{inv.customer.name}</td>
                    <td className="muted">{formatDate(inv.date)}</td>
                    <td className="num" style={{ textAlign:'right' }}>{formatMoney(inv.total, business)}</td>
                    <td><StatusBadge status={inv.status} /></td>
                    <td onClick={e=>e.stopPropagation()}>
                      <div className="row-actions">
                        <button className="icon-btn" title="View" onClick={()=>go('invoice-view', inv.id)}><Icon name="eye" size={15}/></button>
                        <button className="icon-btn" title="Edit" onClick={()=>go('invoice-edit', inv.id)}><Icon name="edit" size={15}/></button>
                        <button className="icon-btn" title="Duplicate" onClick={()=>onDuplicate(inv.id)}><Icon name="copy" size={15}/></button>
                        <button className="icon-btn" title="Download" onClick={()=>onDownload(inv.id)}><Icon name="download" size={15}/></button>
                        <button className="icon-btn icon-btn-danger" title="Delete" onClick={()=>setConfirmDelete(inv.id)}><Icon name="trash" size={15}/></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      <ConfirmDialog open={!!confirmDelete} title="Delete this invoice?" message="This can't be undone. The invoice will be permanently removed."
        onCancel={()=>setConfirmDelete(null)} onConfirm={()=>{ onDelete(confirmDelete); setConfirmDelete(null); }} />
    </div>
  );
}

/* ============================= CUSTOMERS ============================= */
function deriveCustomers(invoices){
  const map = new Map();
  invoices.forEach(inv => {
    const c = inv.customer || {};
    if(!c.name) return;
    const key = (c.phone || c.email || c.name).toLowerCase();
    if(!map.has(key)){
      map.set(key, { key, name: c.name, phone: c.phone, email: c.email, invoiceCount:0, totalAmount:0, invoices:[] });
    }
    const entry = map.get(key);
    entry.invoiceCount += 1;
    entry.totalAmount += inv.total;
    entry.invoices.push(inv);
    if(!entry.phone && c.phone) entry.phone = c.phone;
    if(!entry.email && c.email) entry.email = c.email;
  });
  return Array.from(map.values()).sort((a,b)=> b.totalAmount - a.totalAmount);
}

/* ============================= PDF GENERATION ============================= */
async function renderNodeToPdf(node, filename){
  const canvas = await html2canvas(node, { scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  const pageWidth = 210, pageHeight = 297;
  const ratio = canvas.width / canvas.height;
  let w = pageWidth, h = w / ratio;
  if(h > pageHeight){ h = pageHeight; w = h * ratio; }
  const x = (pageWidth - w) / 2;
  pdf.addImage(imgData, 'PNG', x, 0, w, h);
  pdf.save(filename.endsWith('.pdf') ? filename : filename + '.pdf');
}

async function downloadInvoiceOffscreen(invoice, business){
  const host = document.createElement('div');
  host.style.position = 'fixed';
  host.style.left = '-99999px';
  host.style.top = '0';
  document.body.appendChild(host);
  const root = ReactDOM.createRoot(host);
  await new Promise(resolve => {
    root.render(<InvoicePreview invoice={invoice} business={business} />);
    setTimeout(resolve, 400);
  });
  const node = host.querySelector('.invoice-paper');
  try{ if(node) await renderNodeToPdf(node, invoice.number); }
  finally{ root.unmount(); document.body.removeChild(host); }
}

  const [invoices, setInvoices] = useState(()=> {
    const inv = loadLS(LS_KEYS.invoices, null);
    return (inv && inv.some(i => (i.number||'').startsWith('DIG-'))) ? null : inv;
  });
  const [view, setView] = useState('dashboard');
  const [param, setParam] = useState(null);
  const [downloadingId, setDownloadingId] = useState(null);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);

  // first load: start completely empty — nothing is pre-filled, the user provides everything
  useEffect(()=>{
    if(business === null) setBusiness(emptyBusiness());
    if(invoices === null) setInvoices([]);
  }, []); // eslint-disable-line

  useEffect(()=>{ if(business !== null) saveLS(LS_KEYS.business, business); }, [business]);
  useEffect(()=>{ if(invoices !== null) saveLS(LS_KEYS.invoices, invoices); }, [invoices]);

  const go = useCallback((v, p)=>{ setView(v); setParam(p || null); setMobileMenuOpen(false); window.scrollTo(0,0); }, []);

  const resetAllData = useCallback(()=>{
    localStorage.removeItem(LS_KEYS.business);
    localStorage.removeItem(LS_KEYS.invoices);
    setBusiness(emptyBusiness());
    setInvoices([]);
    setConfirmReset(false);
    toast('All data cleared from this browser.');
    setView('dashboard'); setParam(null);
  }, [toast]);

  if(business === null || invoices === null){
    return <div className="boot-screen"><div className="boot-mark"><Icon name="receipt" size={26}/></div></div>;
  }

  /* ---- onboarding ---- */
  if(!business.name && !business.setupSkipped){
    return (
      <OnboardingShell>
        <BusinessForm
          initial={business}
          ctaLabel="Save & Continue"
          onSave={(b)=>{ setBusiness(b); toast('Business information saved.'); go('dashboard'); }}
          secondaryAction={
            <button type="button" className="btn btn-ghost"
              onClick={()=>{ setBusiness(prev=>({ ...prev, setupSkipped:true })); go('dashboard'); }}>
              Skip for now
            </button>
          }
        />
      </OnboardingShell>
    );
  }

  /* ---- invoice CRUD ---- */
  const saveInvoice = (inv, isEdit) => {
    setInvoices(prev => isEdit ? prev.map(i => i.id === inv.id ? inv : i) : [...prev, inv]);
    if(!isEdit) setBusiness(prev => ({ ...prev, nextInvoiceSeq: (prev.nextInvoiceSeq || 1) + 1 }));
    toast(isEdit ? 'Invoice updated successfully.' : 'Invoice created successfully.');
    go('invoice-view', inv.id);
  };

  const deleteInvoice = (id) => {
    setInvoices(prev => prev.filter(i => i.id !== id));
    toast('Invoice deleted.');
  };

  const duplicateInvoice = (id) => {
    const src = invoices.find(i => i.id === id);
    if(!src) return;
    const copy = {
      ...src, id: uid('inv'), number: nextInvoiceNumber(business), date: todayISO(),
      status: 'unpaid', createdAt: new Date().toISOString(),
      items: src.items.map(it => ({ ...it, id: uid('it') })),
    };
    setInvoices(prev => [...prev, copy]);
    setBusiness(prev => ({ ...prev, nextInvoiceSeq: (prev.nextInvoiceSeq || 1) + 1 }));
    toast('Invoice duplicated.');
    go('invoice-view', copy.id);
  };

  const setStatus = (id, status) => {
    setInvoices(prev => prev.map(i => i.id === id ? { ...i, status } : i));
  };

  const downloadInvoiceById = async (id) => {
    const inv = invoices.find(i => i.id === id);
    if(!inv) return;
    setDownloadingId(id);
    try{ await downloadInvoiceOffscreen(inv, business); toast('PDF downloaded.'); }
    catch(e){ toast('Could not generate PDF. Try again.', 'error'); }
    setDownloadingId(null);
  };

  const printInvoiceRef = () => {
    document.body.classList.add('print-mode');
    setTimeout(()=>{ window.print(); setTimeout(()=> document.body.classList.remove('print-mode'), 300); }, 60);
  };

  /* ---- routing ---- */
  let content = null;
  if(view === 'dashboard'){
    content = <Dashboard business={business} invoices={invoices} go={go} />;
  } else if(view === 'invoices'){
    content = <InvoiceHistory invoices={invoices} business={business} go={go} onDuplicate={duplicateInvoice} onDelete={deleteInvoice} onDownload={downloadInvoiceById} />;
  } else if(view === 'invoice-view'){
    const inv = invoices.find(i => i.id === param);
    content = <InvoiceView invoice={inv} business={business} go={go} onDelete={deleteInvoice} onDuplicate={duplicateInvoice}
      onDownload={(invObj)=>downloadInvoiceById(invObj.id)} onPrint={printInvoiceRef} onStatusChange={setStatus}
      downloading={downloadingId === param} />;
  } else if(view === 'invoice-new'){
    content = <CreateInvoice business={business} existingInvoice={null} onSave={saveInvoice} onCancel={()=>go('invoices')} go={go} />;
  } else if(view === 'invoice-edit'){
    const inv = invoices.find(i => i.id === param);
    content = inv
      ? <CreateInvoice business={business} existingInvoice={inv} onSave={(v)=>saveInvoice(v, true)} onCancel={()=>go('invoice-view', inv.id)} go={go} />
      : <EmptyState icon="file" title="Invoice not found" actionLabel="Back to Invoices" onAction={()=>go('invoices')} />;
  } else if(view === 'customers'){
    content = <Customers invoices={invoices} business={business} go={go} />;
  } else if(view === 'customer-detail'){
    content = <CustomerDetail invoices={invoices} business={business} customerKey={param} go={go} />;
  } else if(view === 'settings'){
    content = (
      <div>
        <Topbar title="Settings" subtitle="Manage your business profile, branding and invoice preferences." />
        <BusinessForm initial={business} ctaLabel="Save Changes" onSave={(b)=>{ setBusiness(b); toast('Business information saved.'); }} />
        <section className="panel panel-danger">
          <h3 className="panel-title">Danger zone</h3>
          <p className="muted small">Permanently erase your business profile and every saved invoice from this browser. This cannot be undone.</p>
          <button type="button" className="btn btn-danger" style={{ marginTop:12 }} onClick={()=>setConfirmReset(true)}>
            <Icon name="trash" size={16}/>Clear all data
          </button>
        </section>
      </div>
    );
  } else if(view === 'setup'){
    content = (
      <div>
        <Topbar title="Business Setup" />
        <BusinessForm initial={business} ctaLabel="Save" onSave={(b)=>{ setBusiness(b); toast('Business information saved.'); go('dashboard'); }} />
      </div>
    );
  }

  return (
    <div className="app-shell">
      <Sidebar view={view} go={go} business={business} />
      <main className="app-main">
        <div className="app-main-inner">{content}</div>
      </main>
      <MobileNav view={view} go={go} />
      {downloadingId && (
        <div className="loading-overlay"><div className="loading-card"><div className="spinner" />Preparing invoice…</div></div>
      )}
      <ConfirmDialog open={confirmReset} title="Clear all data?"
        message="This deletes your business profile and every saved invoice from this browser. This cannot be undone."
        confirmLabel="Clear everything" danger
        onCancel={()=>setConfirmReset(false)} onConfirm={resetAllData} />
    </div>
  );
}

/* ============================= MOUNT ============================= */
const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(<ToastProvider><App /></ToastProvider>);

</script>
</body>
</html>
